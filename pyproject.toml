[project]
name = "grandeursphy"
version = "0.1.0"
description = "Grandeurs physiques avec unités, constantes, chiffres significatifs et sortie siunitx, au-dessus de pint"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Antonin Marchand" }]
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandeurs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
