[project]
name = "grandeursphy"
version = "0.1.0"
description = "Grandeurs physiques avec unités, constantes, chiffres significatifs et sortie siunitx, au-dessus de pint"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonin Marchand" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pint>=0.25",
    "scipy>=1.15",
    "uncertainties>=3.2",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandeurs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Noms hérités de l'ancien paquet constantes (mmHG), gardés pour les corrigés.
"src/grandeurs/constantes.py" = ["N816"]
"src/grandeurs/flottants.py" = ["N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Un avertissement inattendu (dont SansUniteWarning) fait échouer le test.
filterwarnings = ["error"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
